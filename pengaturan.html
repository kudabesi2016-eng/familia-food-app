<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan - Familia Food</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7f6;color:#333}.wrap{max-width:850px;margin:auto;padding:30px}.card{background:#fff;padding:25px;border-radius:14px;box-shadow:0 2px 10px #0000000d}.top{display:flex;justify-content:space-between}h1{color:#146b3a}.field{margin-top:16px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}.btn{margin-top:22px;padding:12px 20px;border:0;border-radius:8px;background:#146b3a;color:white;cursor:pointer}.preview{margin-top:20px;padding:18px;border-radius:12px;background:#f0f8f3}.preview img{max-width:100px;max-height:70px;object-fit:contain}.msg{margin-top:12px}
</style></head><body><div class="wrap"><div class="top"><h1>⚙️ Pengaturan</h1><a href="index.html">← Dashboard</a></div><div class="card"><div class="field"><label>Nama Usaha</label><input id="nama" value="Familia Food"></div><div class="field"><label>URL Logo</label><input id="logo" placeholder="https://..."></div><div class="field"><label>Warna Aplikasi</label><input id="warna" value="#146b3a" type="text"></div><div class="field"><label>Admin</label><input id="admin" placeholder="Nama admin"></div><button class="btn" id="save">Simpan Pengaturan</button><div id="msg"></div><div class="preview"><b>Preview</b><div id="prevNama">Familia Food</div><img id="prevLogo" style="display:none"></div></div></div><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await supabaseClient.from('pengaturan').select('*').order('id',{ascending:true}).limit(1);if(r.error){$('msg').textContent='Belum bisa membaca pengaturan: '+r.error.message;return}const x=(r.data||[])[0];if(x){$('nama').value=x.nama_usaha||'Familia Food';$('logo').value=x.logo||'';$('warna').value=x.warna||'#146b3a';$('admin').value=x.admin||'';preview()}}function preview(){$('prevNama').textContent=$('nama').value||'Familia Food';const u=$('logo').value.trim();$('prevLogo').src=u;$('prevLogo').style.display=u?'block':'none'}['nama','logo'].forEach(id=>$(id).oninput=preview);$('save').onclick=async()=>{const data={nama_usaha:$('nama').value.trim()||'Familia Food',logo:$('logo').value.trim()||null,warna:$('warna').value.trim()||'#146b3a',admin:$('admin').value.trim()||null,updated_at:new Date().toISOString()};const old=await supabaseClient.from('pengaturan').select('id').order('id',{ascending:true}).limit(1);let r;if(old.data&&old.data[0])r=await supabaseClient.from('pengaturan').update(data).eq('id',old.data[0].id);else r=await supabaseClient.from('pengaturan').insert([data]);$('msg').textContent=r.error?'Gagal: '+r.error.message:'Pengaturan berhasil disimpan.'};load();preview();</script></body></html>
