name: Build Familia Food APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Integration gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          set -e
          for f in *.js; do
            [ -f "$f" ] && node --check "$f"
          done
          node --check scripts/deep-integration-smoke.mjs
          node --check scripts/live-supabase-test.mjs

      - name: Deep Integration Smoke Test
        run: node scripts/deep-integration-smoke.mjs

      - name: Live Supabase Integration Test
        run: node scripts/live-supabase-test.mjs

  android:
    name: Android APK
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: |
          rm -rf www
          mkdir -p www
          cp *.html *.css *.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-food-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
