name: Build Familia Food Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "*.html"
      - "*.js"
      - "*.css"
      - "tests/**"
      - "SUPABASE-EXPANSION.sql"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          find . -maxdepth 1 -type f \
            \( -name "*.html" -o -name "*.js" -o -name "*.css" \) \
            ! -name "capacitor.config.json" \
            -exec cp -f {} www/ \;

          test -f www/index.html

      - name: Deep integration smoke tests
        run: node tests/familia-smoke.mjs

      - name: Live Supabase integration test
        run: node tests/supabase-live.mjs

      - name: Syntax check web scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys

          failed = False
          for p in sorted(Path('.').glob('*.js')):
              r = subprocess.run(['node', '--check', str(p)], capture_output=True, text=True)
              if r.returncode:
                  failed = True
                  print(f'FAIL JS {p}:')
                  print(r.stderr)

          for p in sorted(Path('.').glob('*.html')):
              text = p.read_text(encoding='utf-8')
              for i, m in enumerate(re.finditer(r'<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)</script>', text, re.I), start=1):
                  code = m.group(1)
                  if not code.strip():
                      continue
                  tmp = Path(tempfile.gettempdir()) / f'ff_{p.stem}_{i}.js'
                  tmp.write_text(code, encoding='utf-8')
                  r = subprocess.run(['node', '--check', str(tmp)], capture_output=True, text=True)
                  if r.returncode:
                      failed = True
                      print(f'FAIL INLINE {p} script #{i}:')
                      print(r.stderr)

          if failed:
              sys.exit(1)
          print('All JS and inline HTML scripts passed syntax check.')
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-food-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
