<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekap - Familia Food</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5faf7;color:#233}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#087443;text-decoration:none;font-weight:bold}h1{color:#087443}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tab{padding:10px 18px;border:1px solid #087443;border-radius:8px;color:#087443;background:white;cursor:pointer}.tab.active{background:#087443;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;padding:20px;border-radius:14px;margin-top:18px;box-shadow:0 2px 10px #0000000d}.stat{background:#f0f8f3;padding:16px;border-radius:12px}.stat h3{margin:0;color:#087443}.nilai{font-size:23px;font-weight:bold;margin-top:7px}table{width:100%;border-collapse:collapse;min-width:800px}th{background:#087443;color:white;padding:11px;text-align:left}td{padding:10px;border-bottom:1px solid #ddd}.tablewrap{overflow:auto}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:15px}}
</style></head><body><div class="wrap"><div class="top"><h1>📊 Rekap Penjualan</h1><a class="back" href="index.html">← Dashboard</a></div><div class="tabs"><button class="tab active" data-period="day">Harian</button><button class="tab" data-period="week">Mingguan</button><button class="tab" data-period="month">Bulanan</button></div><div class="cards"><div class="stat"><h3>Total Terjual</h3><div class="nilai" id="qty">0</div></div><div class="stat"><h3>Omzet</h3><div class="nilai" id="omzet">Rp 0</div></div><div class="stat"><h3>Total HPP</h3><div class="nilai" id="hpp">Rp 0</div></div><div class="stat"><h3>Total Laba</h3><div class="nilai" id="laba">Rp 0</div></div></div><div class="card"><h2 id="title">Penjualan Hari Ini</h2><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Produk</th><th>Qty</th><th>Channel</th><th>Omzet</th><th>HPP</th><th>Laba</th></tr></thead><tbody id="rows"><tr><td colspan="7">Memuat...</td></tr></tbody></table></div></div></div><script>let all=[],period='day';const rupiah=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function startDate(){const d=new Date();d.setHours(0,0,0,0);if(period==='day')return d;if(period==='week'){const day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d}d.setDate(1);return d}function filtered(){const s=startDate();return all.filter(x=>new Date(x.tanggal+'T00:00:00')>=s)}function render(){const rows=filtered();const q=rows.reduce((a,x)=>a+Number(x.qty||0),0),o=rows.reduce((a,x)=>a+(Number(x.qty||0)*Number(x.harga||0)),0),h=rows.reduce((a,x)=>a+Number(x.hpp||0),0),l=rows.reduce((a,x)=>a+Number(x.laba||0),0);$('qty').textContent=q;$('omzet').textContent=rupiah(o);$('hpp').textContent=rupiah(h);$('laba').textContent=rupiah(l);$('title').textContent=period==='day'?'Penjualan Hari Ini':period==='week'?'Penjualan Minggu Ini':'Penjualan Bulan Ini';$('rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.produk?.nama_produk||'-')}</td><td>${x.qty}</td><td>${esc(x.channel)}</td><td>${rupiah(Number(x.qty||0)*Number(x.harga||0))}</td><td>${rupiah(x.hpp)}</td><td>${rupiah(x.laba)}</td></tr>`).join(''):'<tr><td colspan="7">Belum ada penjualan pada periode ini.</td></tr>'}function $(id){return document.getElementById(id)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.period;render()});(async()=>{const [sr,pr]=await Promise.all([supabaseClient.from('penjualan').select('*').order('tanggal',{ascending:false}),supabaseClient.from('produk').select('id,nama_produk')]);if(sr.error||pr.error){$('rows').innerHTML='<tr><td colspan="7">Gagal memuat: '+esc((sr.error||pr.error).message)+'</td></tr>';return}const pmap={};(pr.data||[]).forEach(p=>pmap[String(p.id)]=p.nama_produk);all=(sr.data||[]).map(x=>({...x,produk:{nama_produk:pmap[String(x.produk_id)]||'-'}}));render()})();</script></body></html>
