<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Lama - Familia Food</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app-settings.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5faf7;color:#233}.wrap{max-width:1200px;margin:auto;padding:28px}.card{background:#fff;padding:22px;border-radius:14px;margin-top:18px;box-shadow:0 2px 10px #0000000d}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--brand-color,#087443);text-decoration:none;font-weight:bold}h1{color:var(--brand-color,#087443)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}.btn{margin-top:15px;background:var(--brand-color,#087443);color:#fff;border:0;border-radius:8px;padding:11px 18px;cursor:pointer}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{background:var(--brand-color,#087443);color:white;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #ddd}.del{background:#fdecec;color:#a22;border:0;padding:7px;border-radius:6px;cursor:pointer}.msg{margin-top:10px;padding:10px;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:15px}}</style></head><body><div class="wrap"><div class="top"><h1>📁 Data Lama</h1><a class="back" href="index.html">← Dashboard</a></div><div class="card"><p>Masukkan arsip historis tanpa mengubah data penjualan saat ini.</p><div class="grid"><div class="field"><label>Tanggal</label><input id="tanggal" type="date"></div><div class="field"><label>Jenis</label><select id="jenis"><option value="Penjualan">Penjualan</option><option value="Biaya">Biaya</option><option value="Lainnya">Lainnya</option></select></div><div class="field"><label>Jumlah</label><input id="jumlah" type="number" min="0" step="1" value="0"></div><div class="field"><label>Keterangan</label><input id="ket"></div><div class="field"><label>Nominal</label><input id="nominal" type="number" min="0" step="1" value="0"></div><div class="field"><label>Catatan</label><input id="catatan"></div></div><button class="btn" id="save">+ Tambah Data Lama</button><div id="msg"></div></div><div class="card"><h2>Data Historis</h2><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th><th>Nominal</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="7">Memuat...</td></tr></tbody></table></div></div></div><script>const $=id=>document.getElementById(id),rupiah=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function m(t,e=false){$('msg').innerHTML='<div class="msg" style="color:'+(e?'#a22':'var(--brand-color,#087443)')+'">'+esc(t)+'</div>'}function today(){return new Date().toISOString().slice(0,10)}$('tanggal').value=today();async function load(){const r=await supabaseClient.from('data_lama').select('*').order('tanggal',{ascending:false}).order('id',{ascending:false});if(r.error){$('rows').innerHTML='<tr><td colspan="7">Gagal: '+esc(r.error.message)+'</td></tr>';return}const data=r.data||[];$('rows').innerHTML=data.length?data.map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.jenis)}</td><td>${esc(x.jumlah)}</td><td>${esc(x.keterangan)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.catatan)}</td><td><button class="del" onclick="del(${x.id})">Hapus</button></td></tr>`).join(''):'<tr><td colspan="7">Belum ada data lama.</td></tr>'}$('save').onclick=async()=>{const data={tanggal:$('tanggal').value,jenis:$('jenis').value,jumlah:Number($('jumlah').value)||0,keterangan:$('ket').value.trim(),nominal:Number($('nominal').value)||0,catatan:$('catatan').value.trim()};if(!data.tanggal||!data.jenis)return m('Tanggal dan jenis wajib diisi.',true);const r=await supabaseClient.from('data_lama').insert([data]);if(r.error)return m('Gagal menyimpan: '+r.error.message,true);$('tanggal').value=today();$('jumlah').value=0;$('ket').value='';$('nominal').value=0;$('catatan').value='';m('Data lama tersimpan.');load()};window.del=async id=>{if(!confirm('Hapus data ini?'))return;const r=await supabaseClient.from('data_lama').delete().eq('id',id);if(r.error)return m('Gagal menghapus: '+r.error.message,true);m('Data lama dihapus.');load()};load();</script></body></html>
